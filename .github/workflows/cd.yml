name: CD

on:
  push:
    branches: [ main ]

env:
  APP_NAME: banksys_sy_monki
  DEPLOY_DIR: /opt/banksys_sy_monki
  CONTAINER_PORT: 8888
  PORT_START: 8888
  PORT_END: 8898

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            echo ">> Preparing deploy directory"
            mkdir -p ${{ env.DEPLOY_DIR }}

            echo ">> Syncing code"
            cd ${{ env.DEPLOY_DIR }}
            if [ -d .git ]; then
              git pull
            else
              git clone https://github.com/monki-royu/${{ env.APP_NAME }}.git .
            fi

            echo ">> Building Docker image"
            docker build \
              --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
              -t ${{ env.APP_NAME }}:latest .

            echo ">> Finding available host port"
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }
            PORT=""
            for p in $(seq ${{ env.PORT_START }} ${{ env.PORT_END }}); do
              if ! port_in_use "$p"; then PORT="$p"; break; fi
            done
            [ -z "$PORT" ] && { echo ">> Port range ${{ env.PORT_START }}-${{ env.PORT_END }} all occupied, aborting"; exit 1; }
            echo ">> Deploying to host port $PORT"

            echo ">> Removing old container (if any)"
            docker rm -f ${{ env.APP_NAME }} 2>/dev/null || true

            echo ">> Starting new container"
            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${PORT}:${{ env.CONTAINER_PORT }} \
              ${{ env.APP_NAME }}:latest

            echo ">> Waiting for container to be ready"
            sleep 5

            echo ">> Health check"
            curl -fsS http://localhost:${PORT}/health

            echo ""
            echo ">> Deployment successful"
            echo ">> App available at: http://${{ secrets.SSH_HOST }}:${PORT}"