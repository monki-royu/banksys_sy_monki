name: CD

on:
  push:
    branches: [ main ]

env:
  APP_NAME: banksys_sy_monki
  DEPLOY_DIR: /opt/banksys_sy_monki
  CONTAINER_PORT: 8888
  PORT_START: 8888
  PORT_END: 8898

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            echo ">> Creating deploy directory"
            mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Rsync code to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='data/' --exclude='model/saved_models/' --exclude='.github/'
          path: ./
          remote_path: ${{ env.DEPLOY_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build & run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            cd ${{ env.DEPLOY_DIR }}

            echo ">> Building Docker image"
            docker build \
              --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
              -t ${{ env.APP_NAME }}:latest .

            echo ">> Cleaning up old containers"
            docker rm -f ${{ env.APP_NAME }} 2>/dev/null || true

            echo ">> Finding available host port"
            PORT=""
            for p in $(seq ${{ env.PORT_START }} ${{ env.PORT_END }}); do
              echo "  >> Checking port $p..."
              if python3 -c "
import socket
s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
try:
    s.bind(('0.0.0.0', $p))
    s.close()
    exit(0)
except OSError:
    exit(1)
" 2>/dev/null; then
                PORT="$p"
                echo "  >> Port $p is available"
                break
              fi
            done

            if [ -z "${PORT}" ]; then
              echo ">> Port range ${{ env.PORT_START }}-${{ env.PORT_END }} all occupied, aborting"
              exit 1
            fi
            echo ">> Deploying to host port ${PORT}"

            echo ">> Starting production container"
            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${PORT}:${{ env.CONTAINER_PORT }} \
              ${{ env.APP_NAME }}:latest

            echo ">> Waiting for container to be ready"
            sleep 5

            echo ">> Health check"
            python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:${PORT}/health').read().decode())"

            echo ""
            echo ">> Deployment successful"
            echo ">> App available at: http://${{ secrets.SSH_HOST }}:${PORT}"