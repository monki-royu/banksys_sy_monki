name: CD

on:
  push:
    branches: [ main ]

env:
  APP_NAME: banksys_sy_monki
  DEPLOY_DIR: /opt/banksys_sy_monki
  CONTAINER_PORT: 8888
  PORT_START: 8888
  PORT_END: 8898

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            echo ">> Creating deploy directory"
            mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Rsync code to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='data/' --exclude='model/saved_models/' --exclude='.github/'
          path: ./
          remote_path: ${{ env.DEPLOY_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build & run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            cd ${{ env.DEPLOY_DIR }}

            echo ">> Building Docker image"
            docker build \
              --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
              -t ${{ env.APP_NAME }}:latest .

            echo ">> Killing all containers using ports 8888-8898"
            for port in $(seq ${{ env.PORT_START }} ${{ env.PORT_END }}); do
              # Find containers bound to this port and kill them
              docker ps -q --filter "publish=$port" 2>/dev/null | while read cid; do
                echo "  >> Killing container $cid on port $port"
                docker rm -f "$cid" 2>/dev/null || true
              done
            done

            echo ">> Starting production container on port ${{ env.CONTAINER_PORT }}"
            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${{ env.CONTAINER_PORT }}:${{ env.CONTAINER_PORT }} \
              ${{ env.APP_NAME }}:latest

            echo ">> Waiting for container to be ready"
            sleep 5

            echo ">> Health check"
            python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:${{ env.CONTAINER_PORT }}/health').read().decode())"

            echo ""
            echo ">> Deployment successful"
            echo ">> App available at: http://${{ secrets.SSH_HOST }}:${{ env.CONTAINER_PORT }}"